services:
  hermes:
    image: nousresearch/hermes-agent:latest   # pin to an X.Y.Z tag once Phase 1 passes
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Pacific/Auckland
      - HERMES_DASHBOARD=1
    ports:
      - "127.0.0.1:9119:9119"   # dashboard, host localhost only (use an SSH tunnel)
    volumes:
      - ./data:/opt/data
      - ./notes:/opt/data/notes   # inside HERMES_WRITE_SAFE_ROOT; NOT "vault" (Hermes credential store)
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - hermes_net
      - mcp_internal   # reaches homelab-mcp only (internal network owned by ~/homelab-mcp)
    # Only the dashboard port, bound to 127.0.0.1. No docker.sock, no privileged, no network_mode: host.
    # No healthcheck: the docs don't define one.

networks:
  hermes_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-hermes   # fixed name for the host firewall (homelab-mcp/host/homelab-isolation.nft)
    ipam:
      config:
        - subnet: 172.30.10.0/24
  mcp_internal:
    external: true   # created by ~/homelab-mcp (docker compose up there first)
